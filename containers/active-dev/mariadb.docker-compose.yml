services:
  mariadb:
    image: mariadb:10.6.14
    command:
      - bash
      - -ec
      - |
        openssl req -x509 -newkey rsa:2048 -nodes -subj /CN=mariadb \
          -keyout /run/mariadb.key -out /run/mariadb.crt
        chown mysql:mysql /run/mariadb.key /run/mariadb.crt
        exec docker-entrypoint.sh mariadbd --transaction-isolation=READ-COMMITTED \
          --innodb-print-all-deadlocks=ON --require-secure-transport=ON \
          --ssl-key=/run/mariadb.key --ssl-cert=/run/mariadb.crt
    environment:
      MARIADB_USER: candlepin
      MARIADB_PASSWORD: candlepin
      MARIADB_DATABASE: candlepin
      MARIADB_ROOT_PASSWORD: candlepin
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: mysql -hmariadb -ucandlepin -pcandlepin --ssl -e 'SELECT 1'
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 20s

  candlepin:
    build:
      context: ${BUILD_CONTEXT:-.}
      dockerfile: ./containers/active-dev/cs10.Containerfile
      args:
      - WAR_FILE=${WAR_FILE}
    ports:
      - "${CP_PORT:-8443}:8443"
      - "${CP_DEBUG_PORT:-8000}:8000"
    healthcheck:
      test: curl --fail -k https://localhost:8443/candlepin/status
      interval: 2s
      timeout: 5s
      retries: 10
      # A fresh MariaDB database runs the full Liquibase changelog before Candlepin accepts requests.
      start_period: 2m
    depends_on:
      mariadb:
        condition: service_healthy
