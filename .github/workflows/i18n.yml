---
name: I18n
on:
  schedule:
    - cron: '0 7 * * 0,4'
  workflow_dispatch:

env:
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  i18n:
    name: i18n
    runs-on: ubuntu-latest
    concurrency:
      group: i18n-${{ matrix.branch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        branch: [main, candlepin-4.4-HOTFIX, candlepin-4.6-HOTFIX, candlepin-4.7-HOTFIX, candlepin-4.8-HOTFIX]
        include:
          - branch: main
            java-version: 25
          - branch: candlepin-4.4-HOTFIX
            java-version: 17
          - branch: candlepin-4.6-HOTFIX
            java-version: 17
          - branch: candlepin-4.7-HOTFIX
            java-version: 17
          - branch: candlepin-4.8-HOTFIX
            java-version: 25

    steps:
      - name: Mask secrets
        shell: bash
        run: |
          echo "::add-mask::${{ secrets.CANDLEPIN_BOT_TOKEN }}"

      - name: Install dependencies
        shell: bash
        run: sudo apt-get install -y gettext git

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ matrix.java-version }}
          check-latest: ${{ env.JAVA_CHECK_LATEST }}
          set-safe-directory: $GITHUB_WORKSPACE

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-provider: basic

      - name: Run internationalization
        id: i18n
        shell: bash
        run: |
          ./gradlew gettext

          files=$(git diff po/keys.pot | egrep -v -e '^( |\+#|\-#|@@|\+\+\+|\-\-\-|diff|index)' \
            -e 'X-Generator' \
            -e 'POT-Creation-Date' || true)

          if [ -n "$files" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.i18n.outputs.changes == 'true'
        shell: bash
        run: |
          pr_branch="i18n/$GIT_BRANCH"
          template_file="$RUNNER_TEMP/keys.pot"
          title="Update i18n template for $GIT_BRANCH"
          body="Automated update of po/keys.pot for \`$GIT_BRANCH\`."
          pr_branch_exists=false
          expected_pr_branch=""

          cp po/keys.pot "$template_file"
          git restore -- po/keys.pot
          gh auth setup-git

          if git ls-remote --exit-code --heads origin "$pr_branch" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/$pr_branch:refs/remotes/origin/$pr_branch"
            expected_pr_branch=$(git rev-parse "refs/remotes/origin/$pr_branch")
            pr_branch_exists=true
          fi

          git fetch origin "+refs/heads/$GIT_BRANCH:refs/remotes/origin/$GIT_BRANCH"
          git switch -C "$pr_branch" "origin/$GIT_BRANCH"
          cp "$template_file" po/keys.pot
          git add -- po/keys.pot

          has_changes=false
          if ! git diff --cached --quiet; then
            git -c "user.name=$GIT_AUTHOR_NAME" -c "user.email=$GIT_AUTHOR_EMAIL" \
              commit -m "Update i18n template"
            has_changes=true
          fi

          if [ "$has_changes" = true ] || [ "$pr_branch_exists" = true ]; then
            git push "--force-with-lease=refs/heads/$pr_branch:$expected_pr_branch" origin "$pr_branch"
          fi

          pr_number=$(gh pr list --base "$GIT_BRANCH" --head "$pr_branch" --state open --json number \
            --jq '.[0].number // empty')

          if [ "$has_changes" = true ]; then
            if [ -n "$pr_number" ]; then
              gh pr edit "$pr_number" --title "$title" --body "$body"
            else
              gh pr create --base "$GIT_BRANCH" --head "$pr_branch" --title "$title" --body "$body"
            fi
          elif [ -n "$pr_number" ]; then
            gh pr close "$pr_number"
          fi
        env:
          GH_TOKEN: ${{ secrets.CANDLEPIN_BOT_TOKEN }}
          GIT_AUTHOR_EMAIL: '3229038+candlepin-bot@users.noreply.github.com'
          GIT_AUTHOR_NAME: 'candlepin-bot'
          GIT_BRANCH: ${{ matrix.branch }}
