---
name: Rerun affected workflows in long lived branches on push

on:
  push:
    branches:
      - main
      - candlepin-*-HOTFIX
      - feature/*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rerun-workflows:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Mask secrets
        shell: bash
        run: |
          echo "::add-mask::${{ secrets.GITHUB_TOKEN }}"

      - name: Get PR info
        id: PR
        shell: bash
        run: |
          skip_ci=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" | \
            jq --arg sha "$GITHUB_SHA" '
              ((map(select(.head.sha == $sha or .merge_commit_sha == $sha)) | first) // {labels: []}) |
              [.labels[]?.name] | join(",") | ascii_downcase | contains("skip ci")')
          echo "skip_ci=$skip_ci" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rerun workflows
        if: ${{ steps.PR.outputs.skip_ci != 'true' }}
        shell: bash
        run: |
          base_branch="${GITHUB_REF#refs/heads/}"
          pr_workflows=("checkstyle.yml" "spec_tests.yml" "unit_tests.yml" "validate_translations.yml")
          run_ids=()
          failed_ids=()

          # List all affected PRs, excluding bots and drafts.
          prs=$(gh api --method GET --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/pulls" \
            -f base="$base_branch" -f state=open -f per_page=100 | \
            jq -r '.[] |
              select(.draft == false and .user.login != "weblate" and .user.login != "dependabot[bot]") |
              [.number, .head.sha, .head.ref, .head.repo.full_name] | @tsv')

          while IFS=$'\t' read -r pr_number head_sha head_branch head_repo; do
            [[ -n "$pr_number" ]] || continue
            for workflow in "${pr_workflows[@]}"; do
              # Fork runs can omit PR associations, so also match the head repository and branch.
              run_id=$(gh api --method GET --paginate --slurp \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
                -f head_sha="$head_sha" -f event=pull_request -f per_page=100 | \
                jq -r --argjson pr_number "$pr_number" --arg head_repo "$head_repo" \
                  --arg head_branch "$head_branch" '
                  [.[].workflow_runs[] |
                    select(.head_repository.full_name == $head_repo and .head_branch == $head_branch) |
                    select(any(.pull_requests[]; .number == $pr_number) or (.pull_requests | length) == 0)] |
                  max_by([.created_at, .id]) | .id // empty')
              if [[ -n "$run_id" && " ${run_ids[*]} " != *" $run_id "* ]]; then
                run_ids+=("$run_id")
              fi
            done
          done <<< "$prs"

          # Process runs independently so a failure cannot strand the rest of the batch.
          for id in "${run_ids[@]}"; do
            if ! status=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}" | \
              jq -er '.status'); then
              echo "::error::Failed to get status of workflow run $id." >&2
              failed_ids+=("$id")
              continue
            fi

            # Every nonterminal status must finish cancellation before a rerun is requested.
            if [[ "$status" != "completed" ]]; then
              if ! gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel"; then
                echo "::error::Failed to cancel workflow run $id (status: $status)." >&2
                failed_ids+=("$id")
                continue
              fi

              # Give this run up to 60 checks at five-second intervals to complete.
              for ((attempt = 0; attempt < 60; attempt++)); do
                sleep 5
                if ! status=$(gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}" | \
                  jq -er '.status'); then
                  echo "::error::Failed to get status of workflow run $id while waiting for cancellation." >&2
                  status=""
                  break
                fi
                [[ "$status" = "completed" ]] && break
              done
              if [[ "$status" != "completed" ]]; then
                if [[ -n "$status" ]]; then
                  echo "::error::Timed out waiting for workflow run $id to cancel (60 checks, 5-second interval)." >&2
                fi
                failed_ids+=("$id")
                continue
              fi
            fi

            if ! gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/rerun"; then
              echo "::error::Failed to rerun workflow run $id." >&2
              failed_ids+=("$id")
            fi
          done

          if [[ ${#failed_ids[@]} -gt 0 ]]; then
            echo "::error::Failed to rerun workflow runs: ${failed_ids[*]}" >&2
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
