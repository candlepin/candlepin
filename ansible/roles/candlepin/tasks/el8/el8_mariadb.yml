---
- name: "Enable MariaDB DNF modules"
  become: true
  ansible.builtin.command:
    cmd: dnf module -y enable mariadb
  changed_when: false
  tags:
    - candlepin
    - mariadb

- name: "Install MariaDB packages" # noqa: command-instead-of-module
  become: true
  ansible.builtin.command:
    argv:
      - dnf
      - install
      - -y
      - mariadb
      - mariadb-java-client
      - mariadb-server
      - python3-PyMySQL
  environment:
    LC_ALL: C
  register: cp_mariadb_package_install
  changed_when: "'Nothing to do.' not in cp_mariadb_package_install.stdout"
  tags:
    - candlepin
    - mariadb

- name: "Set Candlepin-specific MySQL configuration (collation-server)"
  become: true
  community.general.ini_file:
    path: /etc/my.cnf.d/candlepin.cnf
    mode: '0644'
    section: mysqld
    option: collation-server
    value: utf8_general_ci
    create: true
  tags:
    - candlepin
    - mariadb

- name: "Set Candlepin-specific MySQL configuration (character-set-server)"
  become: true
  community.general.ini_file:
    path: /etc/my.cnf.d/candlepin.cnf
    mode: '0644'
    section: mysqld
    option: character-set-server
    value: utf8
    create: true
  tags:
    - candlepin
    - mariadb

- name: "Set Candlepin-specific MySQL configuration (transaction-isolation)"
  become: true
  community.general.ini_file:
    path: /etc/my.cnf.d/candlepin.cnf
    mode: '0644'
    section: mysqld
    option: transaction-isolation
    value: READ-COMMITTED
    create: true
  tags:
    - candlepin
    - mariadb

- name: "Set Candlepin-specific MySQL configuration (default-time-zone)"
  become: true
  community.general.ini_file:
    path: /etc/my.cnf.d/mariadb-server.cnf
    section: server
    option: default-time-zone
    value: "+00:00"
    create: no
  tags:
    - candlepin
    - mariadb

- name: "Enable and start the MariaDB service"
  become: true
  ansible.builtin.service:
    name: mariadb.service
    enabled: true
    state: started
  tags:
    - candlepin
    - mariadb

- name: "Create the 'candlepin' MariaDB user"
  become: true
  ansible.mysql.mysql_user:
    name: candlepin
    priv: "candlepin.*:ALL,GRANT"
    state: present
  tags:
    - candlepin
    - mariadb

- name: "Create the 'candlepin' MariaDB database"
  ansible.mysql.mysql_db:
    login_user: candlepin
    name: candlepin
    state: present
  tags:
    - candlepin
    - mariadb
